name: Bug report
description: Report a bug so we can fix it
title: "[bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much as you can.
  - type: textarea
    id: describe
    attributes:
      label: Describe the bug
      description: What happened, and what did you expect to happen?
      placeholder: A clear and concise description…
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps that triggers the bug.
      placeholder: |
        1. Go to …
        2. Click …
        3. See error
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, and the version/commit you're on.
      placeholder: Chrome 126 · Windows 11 · commit abc1234
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: This project has a Code of Conduct that participants must follow.
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
