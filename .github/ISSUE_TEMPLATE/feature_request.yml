name: Feature request
description: Propose an idea or improvement
title: "[feat]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for proposing an improvement. Describe the problem you're solving, not just a solution.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is the problem or friction you're experiencing?
      placeholder: It's hard to …
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would fix it? Include sketches or links if helpful.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What else did you consider?
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: This project has a Code of Conduct that participants must follow.
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
